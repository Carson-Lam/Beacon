# version: '3.8'

services:

  # Single-node KRaft (one process as both broker and controller)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: beacon-kafka
    restart: on-failure
    ports:
      - "9092:9092"  
    environment:
      CLUSTER_ID: 2oyms0cLRqqRXlIqZrQNFA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: beacon-kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      until kafka-topics --bootstrap-server kafka:29092 --list > /dev/null 2>&1; do
        echo 'Kafka not ready yet, retrying in 5s...'
        sleep 5
      done
      echo 'Kafka is ready. Creating topics...'
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic market.equities --partitions 1 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic market.crypto --partitions 1 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic sentiment.stocktwits --partitions 1 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic sentiment.scored --partitions 1 --replication-factor 1
      echo 'Topics created.'
      "
    restart: on-failure

  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: beacon-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080" # Spark master UI
      - "7077:7077" # Spark master RPC
      - "4040-4042:4040-4042"
    volumes:
      - ./spark:/opt/spark-apps   # consumer code
      - ./data:/opt/spark-data    # Parquet sinks

  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: beacon-spark-worker
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_WORKER_MEMORY=3G # bronze 512m + crypto 1g + equities 1g + headroom
      - SPARK_WORKER_CORES=3 # one core per streaming app;

    ports:
      - "8081:8081" 
    volumes:
      - ./spark:/opt/spark-apps
      - ./data:/opt/spark-data

  postgres-airflow:
    image: postgres:15
    container_name: beacon-postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data

  airflow-init:
    build: ./airflow
    container_name: beacon-airflow-init
    depends_on:
      - postgres-airflow
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DEFAULT_TIMEZONE: America/New_York
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade &&
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    volumes:
      - ./airflow/dags:/opt/airflow/dags

  airflow-webserver:
    build: ./airflow
    container_name: beacon-airflow-webserver
    depends_on:
      - airflow-init
    environment: *airflow-common-env
    ports:
      - "8082:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    command: webserver

  airflow-scheduler:
    build: ./airflow
    container_name: beacon-airflow-scheduler
    user: "185:0"   # one owner group (0) for the shared lakehouse both spark + airflow
    depends_on:
      - airflow-init
    environment: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./spark:/opt/airflow/shared/spark:ro
      - ./config:/opt/airflow/config:ro
      - ./data:/opt/airflow/data
      - ./dbt:/opt/airflow/dbt 
    command: scheduler

  dbt:
    build: ./dbt
    container_name: beacon-dbt
    user: "185:0"  
    working_dir: /usr/app/dbt
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt
    volumes:
      - ./dbt:/usr/app/dbt     # Project
      - ./data:/usr/app/data   # Delta tables 
      - ./config:/usr/app/config:ro
    command: ["tail", "-f", "/dev/null"]  

volumes:
  airflow_pg_data: