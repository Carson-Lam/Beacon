# version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: beacon-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Single listener setup
  # kafka:
  #   image: confluentinc/cp-kafka:7.6.0
  #   container_name: beacon-kafka
  #   depends_on:
  #     - zookeeper
  #   ports:
  #     - "9092:9092"
  #   environment:
  #     KAFKA_BROKER_ID: 1
  #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #     KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'

  # Multi listener setup w localhost (dev)
  kafka:
      image: confluentinc/cp-kafka:7.6.0
      container_name: beacon-kafka
      restart: on-failure
      depends_on:
        - zookeeper
      ports:
        - "9092:9092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: beacon-kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      until kafka-topics --bootstrap-server kafka:29092 --list > /dev/null 2>&1; do
        echo 'Kafka not ready yet, retrying in 5s...'
        sleep 5
      done
      echo 'Kafka is ready. Creating topics...'
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic market.equities --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic market.crypto --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic sentiment.raw --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic sentiment.reddit --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic sentiment.stocktwits --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic sentiment.scored --partitions 3 --replication-factor 1
      echo 'Topics created.'
      "
    restart: on-failure

  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: beacon-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080" # Spark master UI
      - "7077:7077" # Spark master RPC
    volumes:
      - ./spark:/opt/spark-apps   # consumer code
      - ./data:/opt/spark-data    # Parquet sinks

  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: beacon-spark-worker
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    ports:
      - "8081:8081" 
    volumes:
      - ./spark:/opt/spark-apps
      - ./data:/opt/spark-data


  
  postgres-airflow:
    image: postgres:15
    container_name: beacon-postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data

  airflow-init:
    build: ./airflow
    container_name: beacon-airflow-init
    depends_on:
      - postgres-airflow
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DEFAULT_TIMEZONE: America/New_York
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade &&
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    volumes:
      - ./airflow/dags:/opt/airflow/dags

  airflow-webserver:
    build: ./airflow
    container_name: beacon-airflow-webserver
    depends_on:
      - airflow-init
    environment: *airflow-common-env
    ports:
      - "8082:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    command: webserver

  airflow-scheduler:
    build: ./airflow
    container_name: beacon-airflow-scheduler
    user: "185:0"   # one owner group (0) for the shared lakehouse both spark + airflow
    depends_on:
      - airflow-init
    environment: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./spark:/opt/airflow/shared/spark:ro
      - ./config:/opt/airflow/config:ro
      - ./data:/opt/airflow/data
    command: scheduler

  dbt:
    build: ./dbt
    container_name: beacon-dbt
    user: "185:0"  
    working_dir: /usr/app/dbt
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt
    volumes:
      - ./dbt:/usr/app/dbt     # Project
      - ./data:/usr/app/data   # Delta tables 
      - ./config:/usr/app/config:ro
    command: ["tail", "-f", "/dev/null"]  

volumes:
  airflow_pg_data: