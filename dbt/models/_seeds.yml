version: 2

seeds:
  - name: tickers
    description: >
      Beacon's symbol universe (config/tickers.csv). Single source of truth for the
      producers, the Airflow DAGs and dbt.
    columns:
      - name: ticker
        data_tests: [not_null, unique]
      - name: asset_class
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [equity, crypto]}
      - {name: alpaca_symbol, data_tests: [not_null, unique]}
      - {name: yfinance_symbol, data_tests: [not_null, unique]}
      - {name: stocktwits_symbol, data_tests: [not_null, unique]}
      - {name: live, data_tests: [not_null]}