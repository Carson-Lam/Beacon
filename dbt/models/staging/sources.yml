version: 2

# Source freshness is surfaced by mart_pipeline_health (row count + minutes since latest per table)
# used for the Pipeline Health screen 

sources:
  - name: silver
    description: >
      Silver-layer Delta tables read in place with DuckDB's delta_scan(). Nothing
      copied into the warehouse. Paths are relative to the dbt/ directory.
    tables:
      - name: ohlcv_crypto_1min
        meta:
          delta_path: ../data/silver/ohlcv/crypto/1min
          external_location: "delta_scan('../data/silver/ohlcv/crypto/1min')"

      - name: ohlcv_crypto_5min
        meta:
          delta_path: ../data/silver/ohlcv/crypto/5min
          external_location: "delta_scan('../data/silver/ohlcv/crypto/5min')"

      - name: ohlcv_equities_1min
        meta:
          delta_path: ../data/silver/ohlcv/equities/1min
          external_location: "delta_scan('../data/silver/ohlcv/equities/1min')"

      - name: ohlcv_equities_5min
        meta:
          delta_path: ../data/silver/ohlcv/equities/5min
          external_location: "delta_scan('../data/silver/ohlcv/equities/5min')"

      - name: indicators_crypto
        meta:
          delta_path: ../data/silver/indicators/crypto
          external_location: "delta_scan('../data/silver/indicators/crypto')"

      - name: indicators_equities
        meta:
          delta_path: ../data/silver/indicators/equities
          external_location: "delta_scan('../data/silver/indicators/equities')"

      - name: equities_historical
        meta:
          delta_path: ../data/silver/equities_historical
          external_location: "delta_scan('../data/silver/equities_historical')"

      - name: sentiment_scored
        meta:
          delta_path: ../data/silver/sentiment/scored
          external_location: "delta_scan('../data/silver/sentiment/scored')"

      - name: sentiment_aggregates
        meta:
          delta_path: ../data/silver/sentiment/aggregates
          external_location: "delta_scan('../data/silver/sentiment/aggregates')"