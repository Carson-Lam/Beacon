version: 2

models:
  - name: mart_ticker_snapshot
    description: >
      One row per tracked ticker. Latest price, latest indicator set, change vs. previous
      close, and latest sentiment aggregate. Read by the Watchlist screen. Price comes from
      the newer of the latest streamed 1-min bar and the latest daily close.
    columns:
      - name: ticker
        description: "{{ doc('ticker') }}"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments: {to: "ref('tickers')", field: ticker}
      - {name: asset_class, description: "{{ doc('asset_class') }}"}
      - name: price
        description: Latest price (close of the chosen bar).
        data_tests: [not_null]
      - {name: price_as_of, description: "Start of the 1-min bar, or the trade date at 00:00 UTC for a daily close."}
      - {name: indicators_timeframe, description: "'1m' if price and indicators come from the stream, '1d' if from the daily series."}
      - {name: ref_close, description: "Close the change is measured against: the latest daily close for a streamed price, the prior daily close for a daily price. Null for crypto."}
      - {name: change_abs, description: Price minus ref_close.}
      - {name: change_pct, description: "price / ref_close − 1 (0.012 = +1.2%)."}
      - {name: sma_20, description: "{{ doc('sma_20') }}"}
      - {name: sma_50, description: "{{ doc('sma_50') }}"}
      - {name: rsi_14, description: "{{ doc('rsi_14') }}"}
      - {name: bb_upper, description: "{{ doc('bb_upper') }}"}
      - {name: bb_middle, description: "{{ doc('bb_middle') }}"}
      - {name: bb_lower, description: "{{ doc('bb_lower') }}"}
      - {name: macd, description: "{{ doc('macd') }}"}
      - {name: macd_signal, description: "{{ doc('macd_signal') }}"}
      - {name: macd_hist, description: "{{ doc('macd_hist') }}"}
      - {name: mention_count_24h, description: Scored social posts mentioning the ticker in the trailing 24 hours. Null for tickers without sentiment coverage.}
      - {name: bullish_ratio, description: "FinBERT positive / (positive + negative) over the trailing 24 hours. Null when no post is positive or negative."}
      - {name: velocity_1h_vs_24h, description: Mentions in the last hour divided by the average hourly rate over 24 hours. Above 1 means attention is rising.}
      - {name: sentiment_as_of, description: When the sentiment aggregate was computed.}

  - name: mart_ticker_history
    description: >
      Chart series for the Ticker Detail screen. timeframe '1m' holds streamed bars with
      OHLC and intraday indicators; '1d' holds split- and dividend-adjusted daily OHLCV
      with daily indicators. 5-minute bars (stg_ohlcv_5min) are staged
      and tested but not joined here yet
    data_tests:
      - unique_combination:
          arguments: {columns: [ticker, timeframe, ts]}
    columns:
      - {name: ticker, description: "{{ doc('ticker') }}"}
      - {name: asset_class, description: "{{ doc('asset_class') }}"}
      - name: timeframe
        description: "'1m' (streamed bars) or '1d' (daily closes)."
        data_tests:
          - accepted_values:
              arguments: {values: ['1m', '1d']}
      - {name: ts, description: "Bar start (1m) or trade date at 00:00 UTC (1d)."}
      - {name: open, description: Bar open. Split- and dividend-adjusted for 1d.}
      - {name: high, description: Bar high. Split- and dividend-adjusted for 1d.}
      - {name: low, description: Bar low. Split- and dividend-adjusted for 1d.}
      - {name: close, description: Bar close (1m) or daily close (1d).}
      - {name: volume, description: Traded volume in the bar (split-adjusted for 1d).}      
      - {name: sma_20, description: "{{ doc('sma_20') }}"}
      - {name: sma_50, description: "{{ doc('sma_50') }}"}
      - {name: rsi_14, description: "{{ doc('rsi_14') }}"}
      - {name: bb_upper, description: "{{ doc('bb_upper') }}"}
      - {name: bb_middle, description: "{{ doc('bb_middle') }}"}
      - {name: bb_lower, description: "{{ doc('bb_lower') }}"}
      - {name: macd, description: "{{ doc('macd') }}"}
      - {name: macd_signal, description: "{{ doc('macd_signal') }}"}
      - {name: macd_hist, description: "{{ doc('macd_hist') }}"}

  - name: mart_sentiment_daily
    description: >
      Per-ticker daily sentiment from individual scored posts (UTC calendar days). Pairs
      FinBERT's reading with StockTwits users' own tags for comparison (ADR-003).
    data_tests:
      - unique_combination:
          arguments: {columns: [ticker, day]}
    columns:
      - {name: ticker, description: "{{ doc('ticker') }}"}
      - {name: day, description: UTC calendar day the posts were made.}
      - {name: mention_count, description: Scored posts mentioning the ticker that day.}
      - {name: positive_count, description: Posts FinBERT labelled positive.}
      - {name: negative_count, description: Posts FinBERT labelled negative.}
      - {name: neutral_count, description: Posts FinBERT labelled neutral.}
      - {name: bullish_ratio, description: "FinBERT positive / (positive + negative). Null if neither."}
      - {name: user_bullish_ratio, description: "StockTwits users' self-tagged bullish / (bullish + bearish). Null if no tagged posts."}
      - {name: velocity_vs_7d_avg, description: "That day's mentions divided by the average over the previous 7 calendar days that had posts. Null with no prior history."}

  - name: mart_pipeline_health
    description: >
      One row per silver source table: whether it exists, row count, and latest timestamp.
      Read by the Pipeline Health screen. Missing tables (e.g. equities streams before a
      market-hours run) appear with table_exists = false.
    columns:
      - name: source_table
        description: Silver source name, as declared in sources.yml.
        data_tests: [not_null, unique]
      - {name: table_exists, description: Whether the Delta table exists on disk.}
      - {name: row_count, description: Rows in the table (0 if missing).}
      - {name: latest_at, description: Most recent bar, post, aggregate or trade date in the table.}
      - {name: minutes_since_latest, description: Minutes between latest_at and checked_at.}
      - {name: checked_at, description: When this mart was built.}

  - name: mart_model_features
    description: >
      Feature store for the beacon-direction ML model. One row per equity per
      trading day, scale-invariant features only so one model can be pooled across
      symbols. Read by training (ml/train.py) and nightly inference (model_inference).
      Rows start once every feature is warmed up (~50 trading days) and holds no labels.
    data_tests:
      - unique_combination:
          arguments: {columns: [ticker, trade_date]}
    columns:
      - {name: ticker, description: "{{ doc('ticker') }}", data_tests: [not_null]}
      - {name: trade_date, description: Trading day the features are as of (close of that day)., data_tests: [not_null]}
      - {name: ret_1d, description: Close-to-close return over 1 trading day.}
      - {name: ret_5d, description: Close-to-close return over 5 trading days.}
      - {name: ret_20d, description: Close-to-close return over 20 trading days.}
      - {name: close_vs_sma20, description: "close / sma_20 − 1."}
      - {name: close_vs_sma50, description: "close / sma_50 − 1."}
      - {name: rsi_14, description: "{{ doc('rsi_14') }}"}
      - {name: macd_hist_norm, description: MACD histogram divided by close.}
      - {name: bb_pct_b, description: "Bollinger %B: (close − bb_lower) / (bb_upper − bb_lower). 0 at the lower band, 1 at the upper; can go outside 0–1."}
      - {name: realized_vol_20d, description: Sample standard deviation of the last 20 daily returns (not annualised).}
      - {name: volume_z_20d, description: "Volume z-score: today against the mean and standard deviation of the 20 prior sessions."}
      - {name: dist_prev_high, description: "Structure. (close − previous day's high) / close. Positive = closed above yesterday's high."}
      - {name: dist_prev_low, description: "Structure. (close − previous day's low) / close. Negative = closed below yesterday's low."}
      - {name: dist_20d_high, description: "Structure. (close − highest high of the 20 prior sessions) / close. Positive = 20-day breakout."}
      - {name: dist_20d_low, description: "Structure. (close − lowest low of the 20 prior sessions) / close. Negative = 20-day breakdown."}
      - {name: higher_highs_10d, description: "Structure. Days in the last 10 whose high exceeded the previous day's high (0–10)."}
      - {name: higher_lows_10d, description: "Structure. Days in the last 10 whose low exceeded the previous day's low (0–10)."}
      - {name: gap_pct, description: "Structure. open / previous close − 1."}
      - {name: spy_ret_5d, description: SPY 5-day return on the same date. Market context.}
      - {name: mention_count, description: "Sentiment. Scored StockTwits posts assigned to this session after prior close. Null where there is no coverage."}
      - {name: bullish_ratio, description: "Sentiment. FinBERT positive / (positive + negative) for this session's posts. Null if neither."}
      - {name: velocity_vs_prior_7, description: "Sentiment. mention_count / average mention_count of the 7 prior sessions. Monday absorbs weekend posts so reads high."}

  - name: mart_model_labels
    description: >
      Training target for the beacon-direction ML model
    data_tests:
      - unique_combination:
          arguments: {columns: [ticker, trade_date]}
    columns:
      - {name: ticker, description: "{{ doc('ticker') }}", data_tests: [not_null]}
      - {name: trade_date, description: Trading day the signal is computed at (close of that day)., data_tests: [not_null]}
      - name: label
        description: "1 if the 5-day forward return (open t+1 to open t+6) is positive. Null for the last 6 trading days per ticker."
        data_tests:
          - accepted_values:
              arguments: {values: [0, 1]}