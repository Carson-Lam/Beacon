name: beacon
version: "1.0.0"
config-version: 2
profile: beacon

model-paths: ["models"]
seed-paths: ["../config"] 
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  beacon:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: external  
      +format: parquet
      +schema: gold

seeds:
  beacon:
    +schema: reference
    tickers:
      +column_types:
        ticker: varchar
        asset_class: varchar